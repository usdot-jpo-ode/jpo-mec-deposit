include:
  - jpo-utils/docker-compose.yml

services:
  mec_deposit:
    profiles:
      - all
      - mec_deposit_full
      - mec_deposit_base
    build:
      context: .
      dockerfile: Dockerfile
    image: jpo_mec_deposit:latest
    restart: ${RESTART_POLICY}
    ports:
      - "8082:8082"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KAFKA_BOOTSTRAP_SERVERS: ${DOCKER_HOST_IP:?error}:9092
      LOGGING_LEVEL: ${LOGGING_LEVEL}

      # TODO: implement feature flags
      IMP_ENABLED: ${IMP_ENABLED}

      IMP_VENDOR: ${IMP_VENDOR}
      IMP_NETWORK_TYPE: ${IMP_NETWORK_TYPE}
      IMP_CACHE_REGISTRATION: ${IMP_CACHE_REGISTRATION}
      IMP_CERT_PATH: ${IMP_CERT_PATH}

      IMP_MQTT_VENDOR: ${IMP_MQTT_VENDOR}
      IMP_CLIENT_TYPE: ${IMP_CLIENT_TYPE}
      IMP_CLIENT_SUB_TYPE: ${IMP_CLIENT_SUB_TYPE}

      IMP_PARTNER_API_BASE_URI: ${IMP_PARTNER_API_BASE_URI}
      IMP_PARTNER_USER: ${IMP_PARTNER_USER}
      IMP_PARTNER_PASS: ${IMP_PARTNER_PASS}
      IMP_MEC_LATITUDE: ${IMP_MEC_LATITUDE}
      IMP_MEC_LONGITUDE: ${IMP_MEC_LONGITUDE}
    logging:
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - ${DOCKER_SHARED_VOLUME}/resources:/home/resources

  # ODE Services:
  ode:
    profiles:
      - all
      - mec_deposit_full
    # load this from a local tar file, e.g.:
    # docker load -i jpo_ode_12_17_24.tar
    image: jpoode_ode:latest
    restart: ${RESTART_POLICY}
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    ports:
      - "8080:8080"
      - "9090:9090"
      - "46753:46753/udp"
      - "46800:46800/udp"
      - "47900:47900/udp"
      - "44900:44900/udp"
      - "44910:44910/udp"
      - "44920:44920/udp"
      - "44930:44930/udp"
      - "44940:44940/udp"
      - "44990:44990/udp"
      - "5555:5555/udp"
      - "6666:6666/udp"
    environment:
      DOCKER_HOST_IP: ${DOCKER_HOST_IP}
      ODE_KAFKA_BROKERS: ${DOCKER_HOST_IP}:9092
      ODE_SECURITY_SVCS_SIGNATURE_URI: ${ODE_SECURITY_SVCS_SIGNATURE_URI}
      ODE_RSU_USERNAME: ${ODE_RSU_USERNAME}
      ODE_RSU_PASSWORD: ${ODE_RSU_PASSWORD}
      KAFKA_TYPE: ${KAFKA_TYPE}
      CONFLUENT_KEY: ${CONFLUENT_KEY}
      CONFLUENT_SECRET: ${CONFLUENT_SECRET}
      DATA_SIGNING_ENABLED_RSU: ${DATA_SIGNING_ENABLED_RSU}
      DATA_SIGNING_ENABLED_SDW: ${DATA_SIGNING_ENABLED_SDW}
      DEFAULT_SNMP_PROTOCOL: ${DEFAULT_SNMP_PROTOCOL}
      KAFKA_LINGER_MS: ${KAFKA_LINGER_MS}
      ODE_TIM_INGEST_MONITORING_ENABLED: ${ODE_TIM_INGEST_MONITORING_ENABLED}
      ODE_TIM_INGEST_MONITORING_INTERVAL: ${ODE_TIM_INGEST_MONITORING_INTERVAL}
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8080"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 10s
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  adm:
    profiles:
      - all
      - mec_deposit_full
    image: usdotjpoode/asn1_codec:latest
    restart: ${RESTART_POLICY}
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
    environment:
      DOCKER_HOST_IP: ${DOCKER_HOST_IP:?error}
      KAFKA_TYPE: ${KAFKA_TYPE}
      CONFLUENT_KEY: ${CONFLUENT_KEY}
      CONFLUENT_SECRET: ${CONFLUENT_SECRET}
      ACM_CONFIG_FILE: adm.properties
      ACM_LOG_TO_CONSOLE: ${ADM_LOG_TO_CONSOLE}
      ACM_LOG_TO_FILE: ${ADM_LOG_TO_FILE}
      ACM_LOG_LEVEL: ${ADM_LOG_LEVEL}
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ${DOCKER_SHARED_VOLUME}:/asn1_codec_share
    logging:
      options:
        max-size: "10m"
        max-file: "5"
