#General Properties
#==================
groupId: ^project.groupId^
artifactId: ^project.artifactId^
version: ^project.version^
server.port: 8082

# MEC Deposit Metrics
mec-deposit:
  metrics:
    enabled: true
    kafka-topic: topic.MecDepositMetrics
  etx:
    enabled: false
    vendor: "default-vendor"
    network-type: "non-VZ"
    cache-registration: false
    certificate-path: "etx/"
    client-type: "Software"
    client-sub-type: "Application"
    partner-api:
      base-uri: "http://localhost:8080"
      username: "test-user"
      password: "test-password"
      # used for the partner api registration to determine the MEC location
      mec-latitude: "00.0000"
      mec-longitude: "00.0000"
      clear-tim:
        enabled: false
        interval: 10
    mqtt:
      qos: 0
      max-inflight: 10
      connection-timeout: 30
      keep-alive-interval: 60
      completion-timeout: 5000
      max-messages-per-second: 50
      # stale message threshold in milliseconds
      stale-message-threshold: 250
      vendor: "default-mqtt-vendor"
      message-format: "j2735"
      subscriptions:
        - "vzimp/1/ClientInfo"
    depositors:
      bsm:
        mqtt:
          enabled: false
          kafka-topic: "topic.OdeBsmJson"
      spat:
        mqtt:
          enabled: false
          kafka-topic: "topic.OdeSpatJson"
      tim:
        mqtt:
          enabled: false
          kafka-topic: "topic.OdeTimJson"
        api:
          enabled: false
          kafka-topic: "topic.OdeTimJsonTMCFiltered"
      map:
        mqtt:
          enabled: false
          kafka-topic: "topic.OdeMapJson"
        api:
          enabled: false
          kafka-topic: "topic.OdeMapJson"

# microservice actuator
management:
  endpoints:
    web:
      exposure:
        include: "*"
  server:
    port: 8082

logging:
  level:
    root: INFO
    org.springframework.kafka: info
    org.springframework.web: WARN
    guru.springframework.controllers: WARN
    org.springframework.integration.mqtt: INFO
    us.dot.its.jpo.ode.mec.deposit: INFO
    org.apache.kafka: WARN

# Spring boot properties
spring:
  kafka:
    bootstrap-servers: localhost:19092
    consumer:
      group-id: test-group
      fetch-min-size: 1
      fetch-max-wait: 50
      max-poll-records: 500
      auto-offset-reset: latest
      enable-auto-commit: true
      auto-commit-interval: 100
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: BATCH
      poll-timeout: 1
      idle-event-interval: 1
      idle-between-polls: 0
