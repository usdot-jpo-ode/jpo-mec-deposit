#General Properties
#==================
groupId: ^project.groupId^
artifactId: ^project.artifactId^
version: ^project.version^
server.port: 8082

# MEC Deposit Metrics
mec-deposit:
  metrics:
    enabled: ${METRICS_ENABLED:true}
    kafka-topic: ${METRICS_KAFKA_TOPIC:topic.MecDepositMetrics}
  mqtt-signature-validation:
    enabled: ${MQTT_SIGNATURE_VALIDATION_ENABLED:true}
    api-url: ${MQTT_SIGNATURE_VALIDATION_API_URL:http://127.0.0.1:8088/validate}
  etx:
    enabled: ${ETX_ENABLED:false}
    client-type: ${ETX_CLIENT_TYPE}
    client-sub-type: ${ETX_CLIENT_SUB_TYPE}
    partner-api:
      vendor: ${ETX_REGISTRATION_VENDOR}
      base-uri: ${ETX_PARTNER_API_BASE_URI}
      username: ${ETX_PARTNER_API_USERNAME}
      password: ${ETX_PARTNER_API_PASSWORD}
      # used for the partner api registration to determine the MEC location
      mec-latitude: ${ETX_MEC_LATITUDE}
      mec-longitude: ${ETX_MEC_LONGITUDE}
      network-type: ${ETX_NETWORK_TYPE}
      cache-registration: ${ETX_CACHE_REGISTRATION}
      certificate-path: ${ETX_CERT_PATH}
    mqtt-brokers:
      etx:
        mqtt:
          qos: 0
          max-inflight: 10
          connection-timeout: 30
          keep-alive-interval: 60
          completion-timeout: 5000
          max-messages-per-second: ${ETX_PUBLISH_RATE:50}
          vendor: ${ETX_MQTT_VENDOR}
          precision: 7
          message-format: ${ETX_MQTT_MESSAGE_FORMAT:j2735}
          use-tls: ${ETX_MQTT_USE_TLS:true}
          use-registration: ${ETX_MQTT_USE_REGISTRATION:true}
          require-session-id: ${ETX_MQTT_REQUIRE_SESSION_ID:true}
          broker-uri: ${ETX_MQTT_BROKER_URI:}
          client-id: ${ETX_MQTT_CLIENT_ID:}
          broker-type: ${ETX_MQTT_BROKER_TYPE:ETX}
          dual-publish-enabled: ${ETX_MQTT_DUAL_PUBLISH_ENABLED:false}
          dual-publish-targets: ${ETX_MQTT_DUAL_PUBLISH_TARGETS:ETX,NMI,AV}
          registration-refresh-failure-threshold: ${ETX_REGISTRATION_REFRESH_FAILURE_THRESHOLD:10}
          subscriptions:
            - "vzimp/1/ClientInfo"
        depositors:
          stale-message-threshold: ${ETX_DEPOSITORS_STALE_MESSAGE_THRESHOLD:250}
          bsm:
            mqtt:
              enabled: ${ETX_MQTT_BROKERS_ETX_DEPOSITORS_BSM_MQTT_ENABLED:${ETX_DEPOSITORS_BSM_MQTT_ENABLED:true}}
              kafka-topic: ${ETX_DEPOSITORS_BSM_MQTT_KAFKA_TOPIC:topic.OdeBsmJson}
          psm:
            mqtt:
              enabled: ${ETX_DEPOSITORS_PSM_MQTT_ENABLED:true}
              kafka-topic: ${ETX_DEPOSITORS_PSM_MQTT_KAFKA_TOPIC:topic.OdePsmJson}
          spat:
            mqtt:
              enabled: ${ETX_MQTT_BROKERS_ETX_DEPOSITORS_SPAT_MQTT_ENABLED:${ETX_DEPOSITORS_SPAT_MQTT_ENABLED:true}}
              kafka-topic: ${ETX_DEPOSITORS_SPAT_MQTT_KAFKA_TOPIC:topic.OdeSpatJson}
              intersection-filter:
                enabled: ${ETX_DEPOSITORS_SPAT_INTERSECTION_FILTER_ENABLED:false}
                allowed-intersection-ids: ${ETX_DEPOSITORS_SPAT_ALLOWED_INTERSECTIONS:}
                blocked-intersection-ids: ${ETX_DEPOSITORS_SPAT_BLOCKED_INTERSECTIONS:}
          tim:
            mqtt:
              enabled: ${ETX_MQTT_BROKERS_ETX_DEPOSITORS_TIM_MQTT_ENABLED:${ETX_DEPOSITORS_TIM_MQTT_ENABLED:true}}
              kafka-topic: ${ETX_DEPOSITORS_TIM_MQTT_KAFKA_TOPIC:topic.OdeTimJson}
            api:
              enabled: ${ETX_DEPOSITORS_TIM_API_ENABLED:true}
              kafka-topic: ${ETX_DEPOSITORS_TIM_API_KAFKA_TOPIC:topic.OdeTimJsonTMCFiltered}
          map:
            mqtt:
              enabled: ${ETX_MQTT_BROKERS_ETX_DEPOSITORS_MAP_MQTT_ENABLED:${ETX_DEPOSITORS_MAP_MQTT_ENABLED:true}}
              kafka-topic: ${ETX_DEPOSITORS_MAP_MQTT_KAFKA_TOPIC:topic.OdeMapJson}
            api:
              enabled: ${ETX_DEPOSITORS_MAP_API_ENABLED:true}
              kafka-topic: ${ETX_DEPOSITORS_MAP_API_KAFKA_TOPIC:topic.OdeMapJson}
          sdsm:
            mqtt:
              enabled: ${ETX_MQTT_BROKERS_ETX_DEPOSITORS_SDSM_MQTT_ENABLED:${ETX_DEPOSITORS_SDSM_MQTT_ENABLED:true}}
              kafka-topic: ${ETX_DEPOSITORS_SDSM_MQTT_KAFKA_TOPIC:topic.OdeSdsmJson}
          geohash:
            mqtt:
              enabled: ${ETX_MQTT_BROKERS_ETX_DEPOSITORS_GEOHASH_MQTT_ENABLED:${ETX_DEPOSITORS_GEOHASH_MQTT_ENABLED:false}}
              kafka-topic: ${ETX_DEPOSITORS_GEOHASH_MQTT_KAFKA_TOPIC:topic.GeoHashRoutedMsg}
      nmi:
        mqtt:
          enabled: ${NMI_MQTT_ENABLED:false}
          broker-uri: ${NMI_MQTT_BROKER_URI:}
          client-id: ${NMI_MQTT_CLIENT_ID:jpo-mec-deposit-nmi}
          qos: ${NMI_MQTT_QOS:0}
          max-messages-per-second: ${NMI_MQTT_PUBLISH_RATE:100}
          precision: ${NMI_MQTT_PRECISION:7}
          circuit-breaker-failure-threshold: ${NMI_MQTT_CIRCUIT_BREAKER_FAILURE_THRESHOLD:10}
        depositors:
          stale-message-threshold: ${NMI_DEPOSITORS_STALE_MESSAGE_THRESHOLD:${ETX_DEPOSITORS_STALE_MESSAGE_THRESHOLD:250}}
          bsm:
            mqtt:
              enabled: ${NMI_MQTT_BROKERS_NMI_DEPOSITORS_BSM_MQTT_ENABLED:${ETX_DEPOSITORS_BSM_MQTT_ENABLED:true}}
              kafka-topic: ${ETX_DEPOSITORS_BSM_MQTT_KAFKA_TOPIC:topic.OdeBsmJson}
          psm:
            mqtt:
              enabled: ${ETX_DEPOSITORS_PSM_MQTT_ENABLED:true}
              kafka-topic: ${ETX_DEPOSITORS_PSM_MQTT_KAFKA_TOPIC:topic.OdePsmJson}
          spat:
            mqtt:
              enabled: ${NMI_MQTT_BROKERS_NMI_DEPOSITORS_SPAT_MQTT_ENABLED:${ETX_DEPOSITORS_SPAT_MQTT_ENABLED:true}}
              kafka-topic: ${ETX_DEPOSITORS_SPAT_MQTT_KAFKA_TOPIC:topic.OdeSpatJson}
              intersection-filter:
                enabled: ${NMI_DEPOSITORS_SPAT_INTERSECTION_FILTER_ENABLED:${ETX_DEPOSITORS_SPAT_INTERSECTION_FILTER_ENABLED:false}}
                allowed-intersection-ids: ${NMI_DEPOSITORS_SPAT_ALLOWED_INTERSECTIONS:${ETX_DEPOSITORS_SPAT_ALLOWED_INTERSECTIONS:}}
                blocked-intersection-ids: ${NMI_DEPOSITORS_SPAT_BLOCKED_INTERSECTIONS:${ETX_DEPOSITORS_SPAT_BLOCKED_INTERSECTIONS:}}
          tim:
            mqtt:
              enabled: ${NMI_MQTT_BROKERS_NMI_DEPOSITORS_TIM_MQTT_ENABLED:${ETX_DEPOSITORS_TIM_MQTT_ENABLED:true}}
              kafka-topic: ${ETX_DEPOSITORS_TIM_MQTT_KAFKA_TOPIC:topic.OdeTimJson}
          map:
            mqtt:
              enabled: ${NMI_MQTT_BROKERS_NMI_DEPOSITORS_MAP_MQTT_ENABLED:${ETX_DEPOSITORS_MAP_MQTT_ENABLED:true}}
              kafka-topic: ${ETX_DEPOSITORS_MAP_MQTT_KAFKA_TOPIC:topic.OdeMapJson}
          sdsm:
            mqtt:
              enabled: ${NMI_MQTT_BROKERS_NMI_DEPOSITORS_SDSM_MQTT_ENABLED:${ETX_DEPOSITORS_SDSM_MQTT_ENABLED:true}}
              kafka-topic: ${ETX_DEPOSITORS_SDSM_MQTT_KAFKA_TOPIC:topic.OdeSdsmJson}
          geohash:
            mqtt:
              enabled: ${NMI_MQTT_BROKERS_NMI_DEPOSITORS_GEOHASH_MQTT_ENABLED:${ETX_DEPOSITORS_GEOHASH_MQTT_ENABLED:false}}
              kafka-topic: ${ETX_DEPOSITORS_GEOHASH_MQTT_KAFKA_TOPIC:topic.GeoHashRoutedMsg}
      av:
        mqtt:
          enabled: ${AV_MQTT_ENABLED:false}
          broker-uri: ${AV_MQTT_BROKER_URI:}
          client-id: ${AV_MQTT_CLIENT_ID:jpo-mec-deposit-av}
          qos: ${AV_MQTT_QOS:0}
          max-messages-per-second: ${AV_MQTT_PUBLISH_RATE:100}
          precision: ${AV_MQTT_PRECISION:7}
          circuit-breaker-failure-threshold: ${AV_MQTT_CIRCUIT_BREAKER_FAILURE_THRESHOLD:10}
        depositors:
          stale-message-threshold: ${AV_DEPOSITORS_STALE_MESSAGE_THRESHOLD:${ETX_DEPOSITORS_STALE_MESSAGE_THRESHOLD:250}}
          bsm:
            mqtt:
              enabled: ${AV_MQTT_BROKERS_AV_DEPOSITORS_BSM_MQTT_ENABLED:${ETX_DEPOSITORS_BSM_MQTT_ENABLED:true}}
              kafka-topic: ${ETX_DEPOSITORS_BSM_MQTT_KAFKA_TOPIC:topic.OdeBsmJson}
          psm:
            mqtt:
              enabled: ${ETX_DEPOSITORS_PSM_MQTT_ENABLED:true}
              kafka-topic: ${ETX_DEPOSITORS_PSM_MQTT_KAFKA_TOPIC:topic.OdePsmJson}
          spat:
            mqtt:
              enabled: ${AV_MQTT_BROKERS_AV_DEPOSITORS_SPAT_MQTT_ENABLED:${ETX_DEPOSITORS_SPAT_MQTT_ENABLED:true}}
              kafka-topic: ${ETX_DEPOSITORS_SPAT_MQTT_KAFKA_TOPIC:topic.OdeSpatJson}
              intersection-filter:
                enabled: ${AV_DEPOSITORS_SPAT_INTERSECTION_FILTER_ENABLED:${ETX_DEPOSITORS_SPAT_INTERSECTION_FILTER_ENABLED:false}}
                allowed-intersection-ids: ${AV_DEPOSITORS_SPAT_ALLOWED_INTERSECTIONS:${ETX_DEPOSITORS_SPAT_ALLOWED_INTERSECTIONS:}}
                blocked-intersection-ids: ${AV_DEPOSITORS_SPAT_BLOCKED_INTERSECTIONS:${ETX_DEPOSITORS_SPAT_BLOCKED_INTERSECTIONS:}}
          tim:
            mqtt:
              enabled: ${AV_MQTT_BROKERS_AV_DEPOSITORS_TIM_MQTT_ENABLED:${ETX_DEPOSITORS_TIM_MQTT_ENABLED:true}}
              kafka-topic: ${ETX_DEPOSITORS_TIM_MQTT_KAFKA_TOPIC:topic.OdeTimJson}
          map:
            mqtt:
              enabled: ${AV_MQTT_BROKERS_AV_DEPOSITORS_MAP_MQTT_ENABLED:${ETX_DEPOSITORS_MAP_MQTT_ENABLED:true}}
              kafka-topic: ${ETX_DEPOSITORS_MAP_MQTT_KAFKA_TOPIC:topic.OdeMapJson}
          sdsm:
            mqtt:
              enabled: ${AV_MQTT_BROKERS_AV_DEPOSITORS_SDSM_MQTT_ENABLED:${ETX_DEPOSITORS_SDSM_MQTT_ENABLED:true}}
              kafka-topic: ${ETX_DEPOSITORS_SDSM_MQTT_KAFKA_TOPIC:topic.OdeSdsmJson}
          geohash:
            mqtt:
              enabled: ${AV_MQTT_BROKERS_AV_DEPOSITORS_GEOHASH_MQTT_ENABLED:${ETX_DEPOSITORS_GEOHASH_MQTT_ENABLED:false}}
              kafka-topic: ${ETX_DEPOSITORS_GEOHASH_MQTT_KAFKA_TOPIC:topic.GeoHashRoutedMsg}

# microservice actuator
management:
  endpoints:
    web:
      exposure:
        include: "*"
  server:
    port: 8082

logging:
  level:
    root: INFO
    org.springframework.kafka: info
    org.springframework.web: WARN
    guru.springframework.controllers: WARN
    org.springframework.integration.mqtt: INFO
    us.dot.its.jpo.ode.mec.deposit: ${LOGGING_LEVEL:INFO}
    org.apache.kafka: WARN

# Spring boot properties
spring:
  profiles:
    default: "none"
    active: ${SPRING_PROFILES_ACTIVE:local}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:jpo-mec-deposit}
      fetch-min-size: 1
      fetch-max-wait: 10
      max-poll-records: 100
      auto-offset-reset: latest
      enable-auto-commit: true
      auto-commit-interval: 50
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      heartbeat-interval: 3000
    listener:
      ack-mode: BATCH
      poll-timeout: 100
      idle-event-interval: 100
      idle-between-polls: 0
      concurrency: ${KAFKA_CONCURRENCY:1}
  config:
    import:
      - classpath:application-confluent.yaml
