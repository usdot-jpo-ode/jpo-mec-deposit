#General Properties
#==================
groupId: ^project.groupId^
artifactId: ^project.artifactId^
version: ^project.version^
server.port: 8082

# Depositor specific properties
depositor:
  bsm:
    enabled: ${DEPOSITOR_BSM_ENABLED}
    source-mqtt-kafka-topic: ${BSM_MQTT_KAFKA_TOPIC}
  spat:
    enabled: ${DEPOSITOR_SPAT_ENABLED}
    source-mqtt-kafka-topic: ${SPAT_MQTT_KAFKA_TOPIC}
  tim:
    enabled: ${DEPOSITOR_TIM_ENABLED}
    source-mqtt-kafka-topic: ${TIM_MQTT_KAFKA_TOPIC}
    source-api-kafka-topic: ${TIM_API_KAFKA_TOPIC}
  map:
    enabled: ${MAP_DEPOSITOR_ENABLED}
    source-mqtt-kafka-topic: ${MAP_MQTT_KAFKA_TOPIC}
    source-api-kafka-topic: ${MAP_API_KAFKA_TOPIC}
  imp:
    enabled: ${IMP_ENABLED}
    vendor: ${IMP_VENDOR}
    network-type: ${IMP_NETWORK_TYPE}
    cache-registration: ${IMP_CACHE_REGISTRATION}
    certificate-path: ${IMP_CERT_PATH}
    client-type: ${IMP_CLIENT_TYPE}
    client-sub-type: ${IMP_CLIENT_SUB_TYPE}
    partner-api:
      base-uri: ${IMP_PARTNER_API_BASE_URI}
      user: ${IMP_PARTNER_USER}
      pass: ${IMP_PARTNER_PASS}

      # used for the partner api registration to determine the MEC location
      mec-latitude: ${IMP_MEC_LATITUDE}
      mec-longitude: ${IMP_MEC_LONGITUDE}

    mqtt:
      max-messages-per-second: 50
      stale-message-threshold: 250
      qos: 0
      max-inflight: 10
      connection-timeout: 30
      keep-alive-interval: 60
      completion-timeout: 5000
      vendor: ${IMP_MQTT_VENDOR}
      message-format: j2735
      subscriptions:
        - "vzimp/1/ClientInfo"

# microservice actuator
management:
  endpoints:
    web:
      exposure:
        include: "*"
  server:
    port: 8082

logging:
  level:
    root: INFO
    "[org.springframework.kafka]": info
    org.springframework.web: WARN
    guru.springframework.controllers: WARN
    org.springframework.integration.mqtt: INFO
    us.dot.its.jpo.ode.mec.deposit: ${LOGGING_LEVEL:DEBUG}
    org.apache.kafka: WARN

# Spring boot properties
spring:
  profiles:
    default: "none"
    active: ${SPRING_PROFILES_ACTIVE:local}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: jpo-mec-deposit
      fetch-min-size: 1
      fetch-max-wait: 50
      max-poll-records: 500
      auto-offset-reset: latest
      enable-auto-commit: true
      auto-commit-interval: 100
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: BATCH
      poll-timeout: 1
      idle-event-interval: 1
      idle-between-polls: 0
  config:
    import:
      - classpath:application-confluent.yaml
