name: ci

on:
  pull_request:
  push:
    branches:
      - "develop"
      - "master"
      - "release/*"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v5

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run tests
        run: |
          cd jpo-mec-deposit
          mvn clean install
          mvn test

