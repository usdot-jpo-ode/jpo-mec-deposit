services:
  # ODE Services:
  ode:
    profiles:
      - all
      - ode_full
      - mec_deposit_full
      - ode
    image: usdotjpoode/jpo-ode:${ODE_VERSION:-latest}
    restart: ${RESTART_POLICY}
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
    ports:
      - "8080:8080"
      - "9090:9090"
      - "46753:46753/udp"
      - "46800:46800/udp"
      - "47900:47900/udp"
      - "44900:44900/udp"
      - "44910:44910/udp"
      - "44920:44920/udp"
      - "44930:44930/udp"
      - "44940:44940/udp"
      - "44990:44990/udp"
      - "5555:5555/udp"
      - "6666:6666/udp"
    environment:
      environment:
      DOCKER_HOST_IP: ${DOCKER_HOST_IP}
      ODE_KAFKA_BROKERS: ${DOCKER_HOST_IP}:9092
      KAFKA_TYPE: ${KAFKA_TYPE}
      CONFLUENT_KEY: ${CONFLUENT_KEY}
      CONFLUENT_SECRET: ${CONFLUENT_SECRET}
      DATA_SIGNING_ENABLED_RSU: ${DATA_SIGNING_ENABLED_RSU}
      DATA_SIGNING_ENABLED_SDW: ${DATA_SIGNING_ENABLED_SDW}
      DEFAULT_SNMP_PROTOCOL: ${DEFAULT_SNMP_PROTOCOL}
      KAFKA_LINGER_MS: ${KAFKA_LINGER_MS}
      KAFKA_ACKS: ${KAFKA_ACKS}
      KAFKA_RETRIES: ${KAFKA_RETRIES}
      KAFKA_BATCH_SIZE: ${KAFKA_BATCH_SIZE}
      KAFKA_COMPRESSION_TYPE: ${KAFKA_COMPRESSION_TYPE}
      KAFKA_KEY_SERIALIZER: ${KAFKA_KEY_SERIALIZER}
      KAFKA_VALUE_SERIALIZER: ${KAFKA_VALUE_SERIALIZER}
      KAFKA_PARTITIONER_CLASS: ${KAFKA_PARTITIONER_CLASS}
      ODE_TIM_INGEST_MONITORING_ENABLED: ${ODE_TIM_INGEST_MONITORING_ENABLED}
      ODE_TIM_INGEST_MONITORING_INTERVAL: ${ODE_TIM_INGEST_MONITORING_INTERVAL}
      ODE_STOMP_EXPORTER_ENABLED: ${ODE_STOMP_EXPORTER_ENABLED}
      ODE_SECURITY_SVCS_SIGNATURE_URI: ${ODE_SECURITY_SVCS_SIGNATURE_URI}
    depends_on:
      kafka:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8080"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 10s
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  adm:
    profiles:
      - all
      - ode_full
      - mec_deposit_full
      - adm
    image: usdotjpoode/asn1_codec:${ODE_VERSION:-latest}
    restart: ${RESTART_POLICY}
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
    environment:
      DOCKER_HOST_IP: ${DOCKER_HOST_IP:?error}
      KAFKA_TYPE: ${KAFKA_TYPE}
      CONFLUENT_KEY: ${CONFLUENT_KEY}
      CONFLUENT_SECRET: ${CONFLUENT_SECRET}
      ACM_CONFIG_FILE: adm.properties
      ACM_LOG_TO_CONSOLE: ${ADM_LOG_TO_CONSOLE:-false}
      ACM_LOG_TO_FILE: ${ADM_LOG_TO_FILE:-true}
      ACM_LOG_LEVEL: ${ADM_LOG_LEVEL:-INFO}
    depends_on:
      kafka:
        condition: service_healthy
        required: false
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  aem:
    profiles:
      - all
      - ode_full
      - mec_deposit_full
      - aem
    image: usdotjpoode/asn1_codec:${ODE_VERSION:-latest}
    restart: ${RESTART_POLICY}
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
    environment:
      DOCKER_HOST_IP: ${DOCKER_HOST_IP}
      KAFKA_TYPE: ${KAFKA_TYPE}
      CONFLUENT_KEY: ${CONFLUENT_KEY}
      CONFLUENT_SECRET: ${CONFLUENT_SECRET}
      ACM_CONFIG_FILE: aem.properties
      ACM_LOG_TO_CONSOLE: ${AEM_LOG_TO_CONSOLE:-false}
      ACM_LOG_TO_FILE: ${AEM_LOG_TO_FILE:-true}
      ACM_LOG_LEVEL: ${AEM_LOG_LEVEL:-INFO}
    depends_on:
      kafka:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "5"
